<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Wedding Stories</title>
<meta name="description" content="Tap-through story reel of the five wedding celebrations — Akshay & Shristy.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Pinyon+Script&family=Jost:wght@300;400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6efe4;--paper2:#efe5d5;--ink:#2b3721;--ink2:#46533a;--gold:#a8792e;--gold2:#d6b06a;
--serif:"Cormorant Garamond",Georgia,serif;--script:"Pinyon Script",cursive;--deva:"Tiro Devanagari Hindi",serif;--sans:"Jost",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;min-height:100vh}
img{display:block;max-width:100%}
.head{text-align:center;padding:30px 18px 6px}
.head .k{font-family:var(--sans);letter-spacing:.34em;text-transform:uppercase;font-size:.7rem;color:var(--gold)}
.head h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:.2em 0 .1em;font-weight:500}
.head h1 em{font-style:normal;color:var(--gold)}
.stage{display:grid;place-items:center;padding:6px 10px 14px;position:relative}
/* ambient blurred backdrop (desktop) */
.amb{position:absolute;inset:0;overflow:hidden;z-index:0}
.amb img{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(42px) saturate(.8) brightness(.8);opacity:0;transition:opacity .8s}
.amb img.on{opacity:.45}
.amb::after{content:"";position:absolute;inset:0;background:var(--paper);opacity:.55}

.phone{position:relative;z-index:2;width:min(420px,94vw);aspect-ratio:9/16;border-radius:30px;overflow:hidden;
 background:#000;box-shadow:0 30px 70px -28px rgba(43,55,33,.7),0 0 0 7px #1c231a,0 0 0 8px rgba(214,176,106,.5);touch-action:pan-y}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}
.slide.on{opacity:1;pointer-events:auto}
.slide .ph{position:absolute;inset:0;overflow:hidden}
.slide .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transform:scale(1.02)}
.slide.on .ph img{animation:kb 7s ease-out forwards}
@keyframes kb{to{transform:scale(1.12)}}
.slide .scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.12) 15%,rgba(0,0,0,0) 34%,rgba(0,0,0,.0) 44%,var(--sc1) 74%,var(--sc2) 100%)}
.cap{position:absolute;left:22px;right:22px;bottom:30px;color:#fff;z-index:3;transform:translateY(10px);opacity:0}
.slide.on .cap{animation:rise .6s .18s ease forwards}
@keyframes rise{to{transform:none;opacity:1}}
.cap .kick{font-family:var(--sans);font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:.66rem;color:#fff;opacity:.92}
.cap .kick b{color:var(--acl);font-weight:600}
.cap h2{font-family:var(--serif);font-weight:600;font-style:italic;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.02;margin:.14em 0 .04em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.cap .hi{font-family:var(--deva);font-size:1.02rem;opacity:.96;margin-bottom:9px}
.cap .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px}
.cap .pill{font-family:var(--sans);font-size:.74rem;letter-spacing:.02em;padding:5px 12px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;backdrop-filter:blur(4px)}
.cap .pill.t{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4)}
.cap .pill.d{background:var(--acl);color:#fff;font-weight:500}
.cap .code{font-style:italic;font-size:1rem;line-height:1.35;opacity:.96;max-width:34ch;text-shadow:0 1px 10px rgba(0,0,0,.4)}

/* progress bars */
.bars{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:5px;z-index:6}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.bars i span{display:block;height:100%;width:0;background:#fff;border-radius:3px}
/* top header */
.topbar{position:absolute;top:26px;left:16px;right:16px;z-index:6;display:flex;align-items:center;justify-content:space-between;color:#fff}
.topbar .mono{display:flex;align-items:center;gap:9px;font-family:var(--sans);font-weight:500;font-size:.82rem;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.topbar .mono .av{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55);display:grid;place-items:center;font-family:var(--serif);font-size:.86rem;letter-spacing:.02em}
.topbar .em{font-size:1.15rem;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}

/* tap zones + chevrons */
.nav{position:absolute;top:60px;bottom:0;width:34%;z-index:4}
.nav.l{left:0}.nav.r{right:0}
.chev{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:50%;
 background:rgba(0,0,0,.28);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .25s;backdrop-filter:blur(3px);font-size:18px}
.phone:hover .chev{opacity:.85}
.chev.l{left:10px}.chev.r{right:10px}
.pausehint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;color:#fff;font-family:var(--sans);
 font-size:.8rem;letter-spacing:.08em;background:rgba(0,0,0,.4);padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.phone.paused .pausehint{opacity:1}

/* end card */
.endc{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 color:var(--ink);background:radial-gradient(circle at 50% 30%,#fff7ea,var(--paper2));padding:30px}
.endc.show{display:flex}
.endc .sc{font-family:var(--script);font-size:3.2rem;color:var(--gold);line-height:1}
.endc .ns{font-family:var(--serif);font-size:1.9rem;margin:.2em 0 .1em}
.endc .dt{font-family:var(--sans);letter-spacing:.14em;text-transform:uppercase;font-size:.74rem;color:var(--ink2);margin-top:4px}
.endc .tag{font-family:var(--sans);letter-spacing:.14em;font-weight:600;color:var(--gold);margin-top:16px;font-size:.84rem}
.endc .replay{margin-top:20px;font-family:var(--sans);font-size:.82rem;letter-spacing:.06em;border:1.5px solid var(--gold);color:var(--gold);
 background:none;border-radius:999px;padding:9px 20px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.endc .replay:hover{background:var(--gold);color:#fff}

.foot{text-align:center;padding:4px 18px 60px;color:var(--ink2)}
.foot .note{font-family:var(--sans);font-size:.8rem;letter-spacing:.03em;max-width:460px;margin:0 auto}
.dots{display:flex;gap:7px;justify-content:center;margin:16px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(168,121,46,.3);transition:.3s;cursor:pointer}
.dots i.on{background:var(--gold);transform:scale(1.25)}
</style></head><body>

h;const DUR=6500;
const slidesEl=document.getElementById('slides'),barsEl=document.getElementById('bars'),ambEl=document.getElementById('amb');
const phone=document.getElementById('phone'),endc=document.getElementById('endc'),evLbl=document.getElementById('ev'),emLbl=document.getElementById('em');
const dotsEl=document.getElementById('dots');
EV.forEach((e,i)=>{
 const s=document.createElement('div');s.className='slide';
 s.style.setProperty('--sc1',e.deep+'d9');s.style.setProperty('--sc2',e.deep);s.style.setProperty('--acl',e.accent);
 s.innerHTML=`<div class="ph"><img src="${e.img}" alt="${e.formal}"></div><div class="scrim"></div>
 <div class="cap"><div class="kick"><b>${e.day}</b> &nbsp;·&nbsp; ${e.formal}</div>
 <h2>${e.title}</h2><div class="hi">${e.hi}</div>
 <div class="row"><span class="pill t">🕰 ${e.time}</span><span class="pill d">👗 ${e.dress}</span></div>
 <div class="code">${e.code}</div></div>`;
 slidesEl.appendChild(s);
 const b=document.createElement('i');b.innerHTML='<span></span>';barsEl.appendChild(b);
 const a=document.createElement('img');a.src=e.img;ambEl.appendChild(a);
 const d=document.createElement('i');d.onclick=()=>go(i);dotsEl.appendChild(d);
});
const slides=[...slidesEl.children],bars=[...barsEl.querySelectorAll('span')],ambs=[...ambEl.children],dots=[...dotsEl.children];
let i=0,raf=0,t0=0,paused=false,pauseElapsed=0,ended=false;

function paint(){
 slides.forEach((s,k)=>s.classList.toggle('on',k===i));
 ambs.forEach((a,k)=>a.classList.toggle('on',k===i));
 dots.forEach((d,k)=>d.classList.toggle('on',k===i));
 bars.forEach((b,k)=>b.style.width=k<i?'100%':k>i?'0%':b.style.width);
 evLbl.textContent=EV[i].short;emLbl.textContent=EV[i].ic;
 phone.style.setProperty('--acl',EV[i].accent);
}
function tick(now){ if(paused)return;
 const p=Math.min((now-t0)/DUR,1); bars[i].style.width=(p*100)+'%';
 if(p>=1){ if(i>=N-1){showEnd();return;} go(i+1); return; }
 raf=requestAnimationFrame(tick);
}
function play(){ cancelAnimationFrame(raf); paused=false; t0=performance.now(); bars[i].style.width='0%'; raf=requestAnimationFrame(tick); }
function go(n){ if(ended){hideEnd();} i=Math.max(0,Math.min(N-1,n)); paint(); play(); }
function showEnd(){ cancelAnimationFrame(raf); ended=true; endc.classList.add('show'); bars.forEach(b=>b.style.width='100%'); }
function hideEnd(){ ended=false; endc.classList.remove('show'); }
function pause(){ if(paused||ended)return; paused=true; pauseElapsed=performance.now()-t0; phone.classList.add('paused'); cancelAnimationFrame(raf); }
function resume(){ if(!paused||ended)return; paused=false; phone.classList.remove('paused'); t0=performance.now()-pauseElapsed; raf=requestAnimationFrame(tick); }

/* pointer: tap zones, hold-to-pause, swipe */
let downX=0,downT=0,holdTimer=0,didHold=false;
function onDown(x){ downX=x; downT=performance.now(); didHold=false; holdTimer=setTimeout(()=>{didHold=true;pause();},170); }
function onUp(x,target){ clearTimeout(holdTimer);
 const dt=performance.now()-downT, dx=x-downX;
 if(didHold){ resume(); return; }
 if(Math.abs(dx)>45){ dx<0?go(i+1===N?i:i+1):go(i-1); if(i===N-1&&dx<0)showEnd(); return; }
 // quick tap: zone by x within phone
 const rect=phone.getBoundingClientRect(); const rel=x-rect.left;
 if(rel<rect.width*0.35){ go(Math.max(0,i-1)); }
 else { if(i>=N-1) showEnd(); else go(i+1); }
}
phone.addEventListener('pointerdown',ev=>{ if(ev.target.closest('.chev,.replay,.dots'))return; onDown(ev.clientX); });
phone.addEventListener('pointerup',ev=>{ if(ev.target.closest('.chev,.replay,.dots'))return; onUp(ev.clientX,ev.target); });
phone.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);resume();});
document.getElementById('cl').onclick=e=>{e.stopPropagation();go(Math.max(0,i-1));};
document.getElementById('cr').onclick=e=>{e.stopPropagation();i>=N-1?showEnd():go(i+1);};
document.getElementById('replay').onclick=()=>{hideEnd();go(0);};
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){i>=N-1?showEnd():go(i+1);} else if(e.key==='ArrowLeft'){go(Math.max(0,i-1));} else if(e.key===' '){e.preventDefault();paused?resume():pause();} });
/* embed: always autoplay */
paint();play();
function reportH(){try{parent.postMessage({srH:Math.ceil(document.querySelector('.stage').getBoundingClientRect().height)+12},'*');}catch(e){}}
addEventListener('load',reportH);addEventListener('resize',reportH);
if(window.ResizeObserver){new ResizeObserver(reportH).observe(document.querySelector('.stage'));}
setTimeout(reportH,400);setTimeout(reportH,1200);
